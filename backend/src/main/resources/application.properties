spring.application.name=gateflow
server.port=8081

spring.datasource.url=jdbc:h2:mem:gateflow;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.data.redis.repositories.enabled=false

spring.data.redis.host=localhost
spring.data.redis.port=6379

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

gateflow.usage-url=http://localhost:8082
gateflow.jwt-secret=gateflow-portfolio-secret-key-change-me-32
gateflow.admin-username=admin
gateflow.admin-password=gateflow
gateflow.rate-limit-fallback-local=true
