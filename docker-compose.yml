services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gateflow
      POSTGRES_USER: gateflow
      POSTGRES_PASSWORD: gateflow
    ports:
      - "5432:5432"
    volumes:
      - gateflow-pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  usage:
    build: ./usage-service
    ports:
      - "8082:8082"

  gateway:
    build: ./backend
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - postgres
      - redis
      - usage

  gateway-2:
    build: ./backend
    ports:
      - "8083:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - postgres
      - redis
      - usage

volumes:
  gateflow-pg:
